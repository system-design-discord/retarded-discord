# Edge proxy: one origin in front of both halves, so production has no CORS
# and a grader has a single URL (architecture.tex §4).
#
# Minimal by intent — P-01 needs it to exist for `docker compose up` to give a
# working app. P-02 owns hardening it (timeouts, gzip, security headers,
# rate limits).

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:80;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Uploads are up to 10 MB (media_app.models.validate_file_size).
    client_max_body_size 12M;

    # `$http_host` and not `$host`: `$host` drops the port, so Django built
    # every absolute URI as `http://localhost/...` while the stack is published
    # on 8080. `ImageField` renders `Profile.avatar` through
    # `build_absolute_uri`, so a saved avatar came back pointing at a port
    # nothing listens on and rendered as a broken image (#104). Media URLs are
    # the first place this was visible; it was never specific to them.

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A-1 — uploads are NOT served off the volume any more. This used to be
    # `alias /srv/media/;`, which meant every attachment ever uploaded — a
    # private DM photo, a file in a closed channel — was one guessed path away
    # from anybody at all, logged in or not.
    #
    # The request goes to Django, which checks the signature the API minted into
    # the URL and answers with `X-Accel-Redirect` into the internal location
    # below. So the authorisation is nginx's to enforce and the bytes are still
    # nginx's to send: daphne never streams a file.
    location /media/ {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # `internal` is the whole point: nginx refuses this location to a client and
    # serves it only for an `X-Accel-Redirect` from the block above. Renaming it
    # means renaming `settings.MEDIA_INTERNAL_LOCATION` too.
    location /__protected_media/ {
        internal;
        alias /srv/media/;

        # An internal redirect serves the file through nginx's own static
        # handler, which does not carry the upstream response's headers over —
        # so the `nosniff` the Django view sets never reaches the client and has
        # to be set again here. The volume holds whatever users uploaded; a
        # browser must never re-decide what a stored file is.
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /static/ {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
    }

    # The WebSocket gateway. Real-time is a bonus, but the upgrade headers are
    # cheap now and are exactly what gets forgotten until RT-02 fails.
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # Everything else is the SPA.
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
