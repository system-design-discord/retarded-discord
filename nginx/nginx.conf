# Edge proxy: one origin in front of both halves, so production has no CORS
# and a grader has a single URL (architecture.tex §4).
#
# Minimal by intent — P-01 needs it to exist for `docker compose up` to give a
# working app. P-02 owns hardening it (timeouts, gzip, security headers,
# rate limits).

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:80;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Uploads are up to 10 MB (media_app.models.validate_file_size).
    client_max_body_size 12M;

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploads come straight off the shared volume. Django only serves these
    # when DEBUG is on, so going through the backend would break the moment
    # DEBUG is turned off.
    location /media/ {
        alias /srv/media/;
    }

    location /static/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # The WebSocket gateway. Real-time is a bonus, but the upgrade headers are
    # cheap now and are exactly what gets forgotten until RT-02 fails.
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # Everything else is the SPA.
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
