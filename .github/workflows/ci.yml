# Informational, not a gate. The protection rule on main requires a pull
# request and no status check (execution-plan.md, deviation 3) — this workflow
# exists so a broken migration or an unformatted import is caught by a machine
# instead of by whoever runs the next INT-* script.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: discord
          POSTGRES_USER: discord
          POSTGRES_PASSWORD: discord
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U discord -d discord"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_DB: discord
      POSTGRES_USER: discord
      POSTGRES_PASSWORD: discord
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ci-only-key
      DJANGO_DEBUG: 'False'

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Django system check
        run: python manage.py check

      - name: No model change is missing a migration
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
