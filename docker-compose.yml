# One command brings up the whole product: `cp .env.example .env && docker compose up`.
# Only nginx publishes a port — everything else talks over the internal network.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-discord}
      POSTGRES_USER: ${POSTGRES_USER:-discord}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-discord}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # The backend waits on this rather than retrying its own connection.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-discord} -d ${POSTGRES_DB:-discord}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # RT-01. The channel layer only — no application data lives here, so there
    # is no volume and losing it costs nothing but the open subscriptions.
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1.8-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-discord}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-discord}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      args:
        # pytest and ruff in the running container, for the INT-* scripts.
        INSTALL_DEV: ${BACKEND_INSTALL_DEV:-true}
        # Only matters on Linux, where the bind mount below writes to the host
        # as this uid. Leave alone unless your account is not 1000; see .env.example.
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # Unset falls back to the in-process channel layer (config/settings.py).
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend,nginx}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DJANGO_MEDIA_ROOT: /app/media
      # The entrypoint seeds the README's demo accounts on every start. It is
      # idempotent; set to false for an empty database.
      DJANGO_SEED_DATA: ${DJANGO_SEED_DATA:-true}
      POSTGRES_DB: ${POSTGRES_DB:-discord}
      POSTGRES_USER: ${POSTGRES_USER:-discord}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-discord}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://discord:discord@rabbitmq:5672//}
    volumes:
      # Source is bind-mounted: a code change needs `docker compose restart
      # backend`, not a rebuild. Only a requirements.txt change needs --build.
      - ./backend:/app
      # Uploads survive a rebuild. Must stay below the source mount.
      - media_data:/app/media
      # staticfiles is generated by the entrypoint; keep it out of the host tree.
      - static_data:/app/staticfiles

  celery_worker:
    build:
      context: ./backend
      args:
        # Same image arguments as backend: this runs the same code over the
        # same bind mount, so it must not write as a different uid.
        INSTALL_DEV: ${BACKEND_INSTALL_DEV:-true}
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    restart: unless-stopped
    entrypoint: []
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO"]
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # The worker publishes MESSAGE_CREATED like any other writer, so it needs
      # the same channel layer the gateway reads. Left unset it would fall back
      # to the in-process layer and a dispatched message would reach nobody.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_MEDIA_ROOT: /app/media
      POSTGRES_DB: ${POSTGRES_DB:-discord}
      POSTGRES_USER: ${POSTGRES_USER:-discord}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-discord}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://discord:discord@rabbitmq:5672//}
    volumes:
      - ./backend:/app
      - media_data:/app/media

  celery_beat:
    build:
      context: ./backend
      args:
        # Same image arguments as backend: this runs the same code over the
        # same bind mount, so it must not write as a different uid.
        INSTALL_DEV: ${BACKEND_INSTALL_DEV:-true}
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    restart: unless-stopped
    entrypoint: []
    command:
      ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # The worker publishes MESSAGE_CREATED like any other writer, so it needs
      # the same channel layer the gateway reads. Left unset it would fall back
      # to the in-process layer and a dispatched message would reach nobody.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-insecure-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_MEDIA_ROOT: /app/media
      POSTGRES_DB: ${POSTGRES_DB:-discord}
      POSTGRES_USER: ${POSTGRES_USER:-discord}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-discord}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://discord:discord@rabbitmq:5672//}
    volumes:
      - ./backend:/app
      - media_data:/app/media

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/}
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      # The directory, not the file: a single-file bind mount pins the inode,
      # so editing the config would not take effect on restart.
      - ./nginx:/etc/nginx/conf.d:ro
      # Uploads are served by nginx, not by Django.
      - media_data:/srv/media:ro

volumes:
  postgres_data:
  rabbitmq_data:
  media_data:
  static_data: