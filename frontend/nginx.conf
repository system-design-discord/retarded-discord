# Serves the built SPA and nothing else. The edge proxy in nginx/nginx.conf
# is what routes /api, /media and /ws — this container only knows about files.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # History-API fallback: a deep route like /profile must serve the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
